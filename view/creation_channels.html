<!-- Create Channel Form -->
<div class="container mt-5 create-channel-container">
    <h2 class="text-center mb-4">Create New Channel</h2>
    <form id="createChannelForm" action="../controler/CreateChannelControler.php" method="POST" enctype="multipart/form-data">
        <div class="form-group">
            <label for="channel-name">Channel Name</label>
            <input type="text" class="form-control" id="channel-name" name="name" required>
        </div>

        <div class="form-group">
            <label for="channel-description">Description</label>
            <textarea class="form-control" id="channel-description" name="description" required></textarea>
        </div>

        <div class="form-group">
            <label for="channel-image">Channel Image</label>
            <input type="file" class="form-control" id="channel-image" name="image_url" accept="image/*">
        </div>

        <input type="hidden" name="created_by" value="1"> <!-- This is the default value -->

        <button type="submit" class="btn btn-primary">Create Channel</button>
    </form>

</div>
