<!-- Create Channel Form -->
<div class="container mt-5 create-channel-container">
    <h2 class="text-center mb-4">Create New Channel</h2>
    <form id="createChannelForm" action="../controler/CreateChannelControler.php" method="POST" enctype="multipart/form-data" class="needs-validation" novalidate>


        <div class="form-group">
            <label for="channel-name">Channel Name <span class="text-danger">*</span></label>
            <input type="text" class="form-control" id="channel-name" name="name" placeholder="e.g. general" maxlength="100" required>
            <div class="invalid-feedback">Please enter a valid channel name (max 100 characters).</div>
        </div>

        <div class="form-group">
            <label for="channel-description">Description <span class="text-danger">*</span></label>
            <textarea class="form-control" id="channel-description" name="description" rows="4" placeholder="Describe the channel..." maxlength="255" required></textarea>
            <div class="invalid-feedback">Please provide a description (max 255 characters).</div>
        </div>

        <div class="form-group">
            <label for="channel-image">Channel Image (optional)</label>
            <input type="file" class="form-control-file" id="channel-image" name="image_url" accept="image/*" onchange="previewImage(event)">
            <img id="imagePreview" style="display: none; max-width: 200px; margin-top: 10px;" alt="Image Preview" />
        </div>

        <!-- Optional hidden field for created_by (if session-based user ID is being used) -->
        <input type="hidden" name="created_by" value="1"> <!-- Replace '1' dynamically in PHP -->

        <div class="text-center">
            <button type="submit" class="btn btn-primary">Create Channel</button>
        </div>
    </form>
</div>
