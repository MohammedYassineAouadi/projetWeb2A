<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visionneuse de PDF</title>
    <!-- Ajoutez cette ligne pour charger jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <!-- Votre bouton pour envoyer les données -->
    <button id="saveProgress">Sauvegarder la progression</button>

    <!-- Le script JavaScript -->
    <script>
        // Quand l'utilisateur clique sur le bouton "Sauvegarder la progression"
        $('#saveProgress').on('click', function() {
            // Créez un objet avec les données à envoyer
            const data = {
                id: 54,  // L'ID de votre document
                id_pdf: 54,  // L'ID du PDF
                total_pages: 12,  // Le nombre total de pages du PDF
                pages_lues: 5,  // Le nombre de pages lues
                pourcentage: 41.67  // Le pourcentage de progression
            };

            // Affiche les données dans la console (utile pour vérifier que ça fonctionne)
            console.log(data);

            // Envoie les données au fichier PHP (progression.php)
            $.ajax({
                url: 'progression.php',  // Le fichier PHP qui va recevoir les données
                method: 'POST',  // Méthode d'envoi : POST
                data: JSON.stringify(data),  // Envoie les données sous forme de JSON
                contentType: 'application/json',  // Indique que l'on envoie du JSON
                success: function(response) {
                    console.log('Réponse du serveur :', response);  // Affiche la réponse du serveur
                },
                error: function(xhr, status, error) {
                    console.error('Erreur :', error);  // Affiche une erreur si quelque chose ne va pas
                }
            });
        });
    </script>
</body>
</html>
